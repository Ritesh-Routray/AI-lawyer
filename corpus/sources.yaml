# Primary legal texts for retrieval (RAG). Downloaded by `python scripts/fetch_corpus.py`.
# India Code (indiacode.nic.in) is the canonical source but timed out from our network (HTTP 504),
# so we use official/government mirrors and PRS Legislative Research copies of the Gazette text.
# unit: what a citable chunk is called ("Section" for Acts/Rules, "Article" for the Constitution)

- id: bns_2023
  title: Bharatiya Nyaya Sanhita, 2023
  aliases: [BNS, Bharatiya Nyaya Sanhita]
  unit: Section
  problem_types: [notice, other]   # criminal law: only for notices / out-of-scope triage, never to advise on deposit/refund/salary
  publisher: PRS Legislative Research (copy of Gazette text, Act 45 of 2023)
  urls: ["https://prsindia.org/files/bills_acts/acts_parliament/2023/The%20Bharatiya%20Nyaya%20Sanhita,%202023.pdf"]

